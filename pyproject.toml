[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "devguard-mcp"
version = "0.1.0"
description = "Read-only MCP server and CLI that detects PolinRider and GhostAction supply-chain malware in repos, GitHub Actions workflows and developer machines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "devguard-mcp contributors" }]
keywords = ["mcp", "security", "supply-chain", "malware", "polinrider", "ghostaction", "github-actions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
# The scanning core is standard-library only; `mcp` is needed solely for `devguard-mcp serve`.
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
devguard-mcp = "devguard_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devguard_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=devguard_mcp --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "S"]
ignore = [
    "PLR2004",  # magic values are thresholds documented in docs/DETECTIONS.md
    "PLR0913",  # detector entry points take explicit keyword options
]

[tool.ruff.lint.per-file-ignores]
# Subprocess use is deliberate: fixed argument lists, no shell, read-only commands.
"src/devguard_mcp/{history,machine,github,cleanup}.py" = ["S603", "S607"]
"tests/*" = ["S101", "S603", "S607", "PLR0915"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
