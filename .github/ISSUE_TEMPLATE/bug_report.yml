name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Version, description: Output of `devguard-mcp --version`}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: OS and Python version}
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Include the command and output. Remove secrets and payload text.
    validations: {required: true}
